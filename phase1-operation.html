<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>滾塑成型｜智慧能源管理系統 操作介面 Prototype</title>
<style>
  :root {
    color-scheme: light;
    --surface-1:      #fcfcfb;
    --page:           #eef0f0;
    --ink-primary:    #0b0b0b;
    --ink-secondary:  #52514e;
    --ink-muted:      #898781;
    --grid:           #e1e0d9;
    --baseline:       #c3c2b7;
    --border:         rgba(11,11,11,0.12);
    --blue:           #2a78d6;
    --blue-tint:      #eaf2fc;
    --good:           #0ca30c;
    --good-text:      #006300;
    --good-tint:      #e6f6e6;
    --warn:           #fab219;
    --warn-text:      #8a5a00;
    --warn-tint:      #fdf1d9;
    --crit:           #d03b3b;
    --crit-text:      #ffffff;
    --crit-tint:      #fbe4e4;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; background: var(--page); color: var(--ink-primary);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .num { font-variant-numeric: tabular-nums; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 20px 60px; }

  header.topbar {
    background: var(--surface-1); border-bottom: 1px solid var(--border);
    padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  }
  .topbar .title-block { display: flex; flex-direction: column; }
  .topbar .brand { font-size: 12px; color: var(--ink-muted); }
  .topbar .title { font-weight: 700; font-size: 16px; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700;
    padding: 5px 12px; border-radius: 999px; background: var(--grid); color: var(--ink-secondary);
  }
  .status-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-muted); }
  .status-pill.running { background: var(--blue-tint); color: var(--blue); }
  .status-pill.running .dot { background: var(--blue); animation: pulse 1.1s infinite; }
  .status-pill.done { background: var(--good-tint); color: var(--good-text); }
  .status-pill.done .dot { background: var(--good); }
  .status-pill.alarm { background: var(--crit); color: #fff; }
  .status-pill.alarm .dot { background: #fff; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  .kwh-tile { text-align: right; }
  .kwh-tile .kwh-label { font-size: 11px; color: var(--ink-muted); }
  .kwh-tile .kwh-value { font-size: 22px; font-weight: 800; color: var(--blue); }

  .panel { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 18px 20px; margin-top: 16px; }
  .panel h3 { margin: 0 0 12px; font-size: 14px; display: flex; align-items: center; gap: 8px; }

  .control-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 14px; }
  .field label { display: block; font-size: 11.5px; color: var(--ink-muted); margin-bottom: 5px; }
  .field select, .field input[type=text], .field input[type=number] {
    width: 100%; font-family: inherit; font-size: 13.5px; padding: 8px 9px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--ink-primary);
  }
  .field select:disabled, .field input:disabled { background: var(--grid); color: var(--ink-muted); }
  .field.error input, .field.error select { border-color: var(--crit); }
  .field-error-msg { font-size: 11px; color: var(--crit); margin-top: 4px; display:none; }
  .field.error .field-error-msg { display: block; }

  .mode-toggle { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .mode-toggle button {
    flex: 1; padding: 8px 6px; font-family: inherit; font-size: 12.5px; border: none; background: var(--surface-1);
    color: var(--ink-secondary); cursor: pointer;
  }
  .mode-toggle button.active { background: var(--blue); color: #fff; font-weight: 700; }
  .mode-toggle button:disabled { cursor: not-allowed; opacity: .6; }

  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px; }
  .btn {
    font-family: inherit; font-size: 13px; font-weight: 700; padding: 10px 18px; border-radius: 7px;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--ink-primary); cursor: pointer;
  }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  .btn.warn { background: var(--warn-tint); border-color: var(--warn); color: var(--warn-text); }
  .btn.crit { background: var(--crit); border-color: var(--crit); color: #fff; }
  .btn.ghost { background: var(--surface-1); }

  .stepper { display: flex; gap: 4px; margin-top: 18px; }
  .step-node { flex: 1; text-align: center; padding: 10px 4px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
  .step-node .sn-dot { width: 10px; height: 10px; border-radius: 50%; background: var(--grid); margin: 0 auto 6px; }
  .step-node .sn-label { font-size: 11.5px; color: var(--ink-muted); font-weight: 600; }
  .step-node.idle .sn-dot { background: var(--baseline); }
  .step-node.active { background: var(--blue-tint); border-color: var(--blue); }
  .step-node.active .sn-dot { background: var(--blue); animation: pulse 1.1s infinite; }
  .step-node.active .sn-label { color: var(--blue); }
  .step-node.done .sn-dot { background: var(--good); }
  .step-node.done .sn-label { color: var(--good-text); }

  .field-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .value-box { background: var(--page); border-radius: 8px; padding: 10px 12px; }
  .value-box .vb-label { font-size: 11px; color: var(--ink-muted); margin-bottom: 3px; }
  .value-box .vb-value { font-size: 19px; font-weight: 800; }
  .value-box .vb-unit { font-size: 12px; font-weight: 400; color: var(--ink-muted); margin-left: 2px; }

  .gauge-track { position: relative; height: 10px; background: var(--grid); border-radius: 5px; margin-top: 8px; }
  .gauge-fill { position: absolute; left:0; top:0; height: 100%; border-radius: 5px; background: var(--blue); transition: width .15s linear; }
  .gauge-mark { position: absolute; top: -3px; width: 2px; height: 16px; background: var(--ink-primary); }

  .countdown-row { display: flex; align-items: center; justify-content: space-between; margin: 14px 0; }
  .countdown-row .cd-time { font-size: 30px; font-weight: 800; color: var(--blue); }
  .countdown-row .cd-note { font-size: 11.5px; color: var(--ink-muted); max-width: 280px; text-align: right; line-height: 1.6;}

  .cool-options { display: grid; grid-template-columns: repeat(auto-fit,minmax(150px,1fr)); gap: 10px; margin-bottom: 14px; }
  .cool-card { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
  .cool-card.active { border-color: var(--blue); background: var(--blue-tint); }
  .cool-card .cc-name { font-weight: 700; font-size: 13px; margin-bottom: 3px; }
  .cool-card .cc-note { font-size: 11px; color: var(--ink-muted); line-height: 1.5; }

  .checklist { display: flex; flex-direction: column; gap: 10px; margin-bottom: 14px; }
  .checklist label { display: flex; align-items: center; gap: 10px; font-size: 13.5px; cursor: pointer; }
  .checklist input { width: 17px; height: 17px; }

  .idle-hint { text-align: center; padding: 40px 20px; color: var(--ink-muted); font-size: 13.5px; line-height: 2; }

  .alarm-banner {
    margin-top: 16px; background: var(--crit); color: #fff; border-radius: 10px; padding: 14px 18px;
    font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 10px;
  }

  .report-panel { border: 2px solid var(--good); }
  .report-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(160px,1fr)); gap: 12px; margin-bottom: 16px; }
  .report-bars .bar-row { display: grid; grid-template-columns: 120px 1fr 70px; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 12.5px; }
  .report-bars .bar-track { background: var(--grid); border-radius: 4px; height: 12px; overflow: hidden; }
  .report-bars .bar-fill { height: 100%; background: var(--blue); border-radius: 4px; }
  .cc-result { margin-top: 16px; padding-top: 16px; border-top: 1px dashed var(--grid); display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .cc-result .cc-pct { font-size: 28px; font-weight: 800; color: var(--good-text); }
  .cc-result .cc-desc { font-size: 13px; color: var(--ink-secondary); line-height: 1.7; max-width: 560px; }

  .dashboard-panel { border: 1px solid var(--blue); }
  .dash-desc { font-size: 12.5px; color: var(--ink-secondary); line-height: 1.7; margin: 0 0 12px; }
  .live-line { font-size: 12px; padding: 8px 12px; border-radius: 6px; background: var(--grid); color: var(--ink-muted); margin-bottom: 14px; }
  .live-line.on { background: var(--blue-tint); color: var(--blue); font-weight: 700; }
  .hist-table { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .hist-row { display: grid; grid-template-columns: 1.1fr 1fr 1fr 0.9fr 1.5fr; gap: 10px; padding: 9px 12px; align-items: center; font-size: 12.5px; border-bottom: 1px solid var(--grid); }
  .hist-row:last-child { border-bottom: none; }
  .hist-row.head { background: var(--page); font-weight: 700; color: var(--ink-muted); font-size: 11.5px; }
  .hist-row.best { background: var(--good-tint); }
  .hist-empty { padding: 16px 12px; text-align: center; font-size: 12.5px; color: var(--ink-muted); }
  .badge-min { display: inline-block; font-size: 10.5px; font-weight: 700; color: var(--good-text); background: var(--good-tint); border-radius: 5px; padding: 1px 6px; margin-left: 4px; }
  .dash-hint { font-size: 12px; color: var(--ink-secondary); margin: 12px 0 0; line-height: 1.7; }

  .disclaimer { font-size: 11.5px; color: var(--ink-muted); margin-top: 14px; line-height: 1.7; }

  footer.pagefoot { text-align: center; font-size: 11px; color: var(--ink-muted); padding: 26px 0 10px; }
</style>
</head>
<body>

<header class="topbar">
  <div class="title-block">
    <span class="brand">睿星智宇 Wisphere ｜ Prototype Demo</span>
    <span class="title">威熊塑膠科技｜滾塑成型 智慧能源管理系統 — 操作介面</span>
  </div>
  <div style="display:flex; align-items:center; gap:16px;">
    <span class="status-pill" id="statusPill"><span class="dot"></span><span id="statusText">待機中</span></span>
    <div class="kwh-tile">
      <div class="kwh-label">本批累計能耗</div>
      <div class="kwh-value num" id="kwhTotal">0.0 度</div>
    </div>
  </div>
</header>

<div class="wrap">

  <div class="panel" id="controlPanel">
    <h3>批次設定</h3>
    <div class="control-grid">
      <div class="field">
        <label>產品型號（配方）</label>
        <select id="productSelect">
          <option value="tank">方形儲水桶</option>
          <option value="tower">直立式水塔</option>
          <option value="septic">化糞槽</option>
          <option value="toilet">流動廁所</option>
        </select>
      </div>
      <div class="field">
        <label>批號</label>
        <input type="text" id="batchNoField" disabled placeholder="啟動生產後自動產生">
      </div>
      <div class="field" id="operatorField">
        <label>操作人員 *</label>
        <input type="text" id="operatorInput" placeholder="請輸入姓名／工號">
        <div class="field-error-msg">請先輸入操作人員</div>
      </div>
      <div class="field">
        <label>控制模式</label>
        <div class="mode-toggle" id="modeToggle">
          <button data-mode="auto" class="active">自動（套用配方）</button>
          <button data-mode="manual">手動（可調參數）</button>
        </div>
      </div>
      <div class="field">
        <label>爐溫設定（℃）</label>
        <input type="number" id="tempInput" min="200" max="300" step="5">
      </div>
      <div class="field">
        <label>加熱時間設定（分鐘）</label>
        <input type="number" id="timeInput" min="20" max="60" step="1">
      </div>
    </div>

    <div class="btn-row">
      <button class="btn primary" id="btnStart">▶ 啟動生產</button>
      <button class="btn warn" id="btnPause" disabled>⏸ 暫停</button>
      <button class="btn crit" id="btnStop" disabled>■ 緊急停止</button>
      <button class="btn ghost" id="btnReset">↺ 重置</button>
    </div>
  </div>

  <div class="stepper" id="stepper"></div>

  <div id="dashboardArea"></div>

  <div id="alarmArea"></div>

  <div class="panel" id="stationPanel"></div>

  <div id="reportArea"></div>

  <p class="disclaimer">＊本頁為操作介面 Prototype，計時已加速播放（非實際製程分鐘數），所有溫度／轉速／能耗數值皆為情境模擬，非威熊實際量測數據，實際欄位與數值將依現場設備規格與盤查結果調整。</p>

  <footer class="pagefoot">Phase 1 Prototype｜滾塑成型（方形儲水桶／直立式水塔／化糞槽／流動廁所）｜睿星智宇 Wisphere</footer>
</div>

<script>
const RECIPES = {
  tank:   { name: '方形儲水桶', temp: 245, time: 35 },
  tower:  { name: '直立式水塔', temp: 260, time: 45 },
  septic: { name: '化糞槽',     temp: 255, time: 42, extraChecklist: '隔板／導流結構組裝' },
  toilet: { name: '流動廁所',   temp: 220, time: 25 }
};
const COOL = {
  air:    { name: '風冷',     demoSec: 10, kwh: 3.5, note: '自然對流散熱，耗能最低但週期較長' },
  water:  { name: '水冷',     demoSec: 7,  kwh: 5.5, note: '水冷循環系統，週期與耗能中等' },
  forced: { name: '強制風冷', demoSec: 5,  kwh: 7.0, note: '加裝風扇強制降溫，縮短週期但較耗電' }
};
const STEP_LABELS = ['', '原料進料', '加熱燒結', '冷卻脫模', '修邊組裝', '檢驗入庫'];
const GOV_AVG = 22.0; // 度/件，滾塑成型類政府產業平均係數（示意）

function calcHeatKwh(temp, time) {
  return Math.round(((temp - 150) * 0.08 + time * 0.22) * 10) / 10;
}

let paramHistory = []; // 最近3組已完成批次的參數驗證紀錄

let state = {
  productKey: 'tank',
  batchNo: '',
  operator: '',
  mode: 'auto',
  coolMethod: 'air',
  setpoint: { temp: RECIPES.tank.temp, time: RECIPES.tank.time },
  qty: 1,
  currentStep: 0,     // 0 idle, 1-5 stations, 6 done/report
  running: false,
  paused: false,
  stopped: false,
  stepStartTs: 0,
  elapsedBeforePause: 0,
  totalKwh: 0,
  stepKwh: { 1: 0, 2: 0, 3: 0 },
  heatEndTemp: 25,
  checklist: { edge: false, drill: false, baffle: false },
  inspection: { result: '', leak: '', reason: '' },
  timerId: null
};

function msFor(step) {
  if (step === 1) return 2500;
  if (step === 2) return Math.max(4000, Math.round(state.setpoint.time / 60 * 15000));
  if (step === 3) return COOL[state.coolMethod].demoSec * 1000;
  return 0;
}
function kwhTargetFor(step) {
  if (step === 1) return 0.2;
  if (step === 2) return calcHeatKwh(state.setpoint.temp, state.setpoint.time);
  if (step === 3) return COOL[state.coolMethod].kwh;
  return 0;
}

function genBatchNo() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `WB-${state.productKey.toUpperCase()}-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}

/* ---------- render: header ---------- */
function renderHeader() {
  const pill = document.getElementById('statusPill');
  const txt = document.getElementById('statusText');
  pill.className = 'status-pill';
  if (state.stopped) { pill.classList.add('alarm'); txt.textContent = '緊急停止'; }
  else if (state.currentStep >= 6) { pill.classList.add('done'); txt.textContent = '本批完成'; }
  else if (state.running) { pill.classList.add('running'); txt.textContent = `生產中・${STEP_LABELS[state.currentStep]}`; }
  else { txt.textContent = '待機中'; }

  const committed = Object.values(state.stepKwh).reduce((a,b)=>a+b, 0);
  let inProgress = 0;
  if (state.running && !state.paused && state.currentStep >= 1 && state.currentStep <= 3) {
    const elapsed = state.elapsedBeforePause + (Date.now() - state.stepStartTs);
    const p = Math.min(1, elapsed / msFor(state.currentStep));
    inProgress = kwhTargetFor(state.currentStep) * p - (state.stepKwh[state.currentStep] || 0);
    inProgress = Math.max(0, inProgress);
  }
  document.getElementById('kwhTotal').textContent = (committed + inProgress).toFixed(1) + ' 度';
}

/* ---------- render: control panel ---------- */
function renderControls() {
  document.getElementById('productSelect').value = state.productKey;
  document.getElementById('productSelect').disabled = state.currentStep !== 0;
  document.getElementById('batchNoField').value = state.batchNo;
  document.getElementById('operatorInput').value = state.operator;
  document.getElementById('operatorInput').disabled = state.currentStep !== 0;

  document.querySelectorAll('#modeToggle button').forEach(b => {
    b.classList.toggle('active', b.dataset.mode === state.mode);
    b.disabled = state.currentStep !== 0;
  });

  const tempInput = document.getElementById('tempInput');
  const timeInput = document.getElementById('timeInput');
  tempInput.value = state.setpoint.temp;
  timeInput.value = state.setpoint.time;
  const paramsLocked = !(state.mode === 'manual' && state.currentStep === 0);
  tempInput.disabled = paramsLocked;
  timeInput.disabled = paramsLocked;

  document.getElementById('btnStart').disabled = state.currentStep !== 0;
  document.getElementById('btnPause').disabled = !(state.running && !state.stopped && state.currentStep >= 1 && state.currentStep <= 3);
  document.getElementById('btnPause').textContent = state.paused ? '▶ 繼續' : '⏸ 暫停';
  document.getElementById('btnStop').disabled = !(state.running && !state.stopped && state.currentStep < 6);
}

/* ---------- render: stepper ---------- */
function renderStepper() {
  const el = document.getElementById('stepper');
  el.innerHTML = STEP_LABELS.map((label, i) => {
    if (i === 0) return '';
    let cls = 'idle';
    if (state.currentStep === i && !state.stopped) cls = 'active';
    else if (state.currentStep > i || state.currentStep >= 6) cls = 'done';
    return `<div class="step-node ${cls}"><div class="sn-dot"></div><div class="sn-label">${i}. ${label}</div></div>`;
  }).join('');
}

/* ---------- render: alarm ---------- */
function renderAlarm() {
  const el = document.getElementById('alarmArea');
  el.innerHTML = state.stopped
    ? `<div class="alarm-banner">🛑 緊急停止已觸發，製程已中斷於「${STEP_LABELS[state.currentStep]}」站。請確認現場狀況後按下「重置」以清除警報。</div>`
    : '';
}

/* ---------- render: station panel ---------- */
function renderStation() {
  const el = document.getElementById('stationPanel');
  const recipe = RECIPES[state.productKey];

  if (state.currentStep === 0) {
    el.innerHTML = `<div class="idle-hint">請確認左上方批次設定（產品型號／操作人員），設定完成後按下「啟動生產」開始模擬滾塑成型製程。<br>目前配方：${recipe.name}・爐溫 ${state.setpoint.temp}°C・時間 ${state.setpoint.time} 分鐘</div>`;
    return;
  }
  if (state.currentStep >= 6) { el.innerHTML = ''; return; }

  if (state.currentStep === 1) {
    const p = progressOf(1);
    const targetW = 25 + Math.random() * 0.6 - 0.3;
    el.innerHTML = `
      <h3>STEP 1・原料進料</h3>
      <div class="field-pair">
        <div class="value-box"><div class="vb-label">配方代碼</div><div class="vb-value">${state.productKey.toUpperCase()}-${recipe.temp}/${recipe.time}</div></div>
        <div class="value-box"><div class="vb-label">PE粉料／粒料 設定重量</div><div class="vb-value num">25.0<span class="vb-unit">kg</span></div></div>
      </div>
      <div class="value-box"><div class="vb-label">實際稱重值</div><div class="vb-value num">${(25 * Math.min(1,p) + (Math.random()-0.5)*0.15).toFixed(2)}<span class="vb-unit">kg</span></div></div>
      <div class="countdown-row"><span class="cd-time num">${Math.max(0,((msFor(1)-elapsedOf(1))/1000)).toFixed(1)}s</span><span class="cd-note">秤重進料中，完成後自動進入加熱燒結站</span></div>
    `;
    return;
  }

  if (state.currentStep === 2) {
    const p = progressOf(2);
    const actualTemp = 25 + (state.setpoint.temp - 25) * easeOutQuad(p) + (p>0 && p<1 ? (Math.random()-0.5)*2 : 0);
    const moldTemp = 25 + (state.setpoint.temp - 25) * easeOutQuad(Math.max(0,p-0.15)) * 0.85;
    const instKw = 38 + Math.random()*8;
    const remain = Math.max(0, (msFor(2)-elapsedOf(2))/1000);
    el.innerHTML = `
      <h3>STEP 2・模具密封 → 旋轉爐加熱燒結 <span style="color:var(--crit); font-size:12px;">⚡⚡ 高耗能站</span></h3>
      <div class="field-pair">
        <div class="value-box">
          <div class="vb-label">爐溫 設定值／實際值</div>
          <div class="vb-value num">${state.setpoint.temp}°C ／ ${actualTemp.toFixed(1)}°C</div>
          <div class="gauge-track"><div class="gauge-fill" style="width:${Math.min(100, actualTemp/320*100)}%"></div><div class="gauge-mark" style="left:${state.setpoint.temp/320*100}%"></div></div>
        </div>
        <div class="value-box">
          <div class="vb-label">模內溫度（監控用）</div>
          <div class="vb-value num">${moldTemp.toFixed(1)}<span class="vb-unit">°C</span></div>
        </div>
      </div>
      <div class="field-pair">
        <div class="value-box"><div class="vb-label">雙軸旋轉速度（主軸／副軸）</div><div class="vb-value num">${(4.2+(Math.random()-0.5)*0.1).toFixed(1)} ／ ${(1.1+(Math.random()-0.5)*0.05).toFixed(2)}<span class="vb-unit">rpm</span></div></div>
        <div class="value-box"><div class="vb-label">本站瞬時功率</div><div class="vb-value num">${instKw.toFixed(1)}<span class="vb-unit">kW</span></div></div>
      </div>
      <div class="countdown-row">
        <span class="cd-time num">${remain.toFixed(1)}s</span>
        <span class="cd-note">加熱時間設定：${state.setpoint.time} 分鐘（示範已加速播放）<br>本站累計耗電：${(kwhTargetFor(2)*p).toFixed(1)} 度</span>
      </div>
    `;
    return;
  }

  if (state.currentStep === 3) {
    const p = progressOf(3);
    const cool = COOL[state.coolMethod];
    const startTemp = state.heatEndTemp;
    const actualTemp = startTemp - (startTemp - 30) * easeOutQuad(p) + (p>0&&p<1?(Math.random()-0.5)*1.5:0);
    const remain = Math.max(0, (msFor(3)-elapsedOf(3))/1000);
    el.innerHTML = `
      <h3>STEP 3・冷卻脫模 <span style="color:var(--warn-text); font-size:12px;">⚡ 中耗能站</span></h3>
      <div class="cool-options">
        ${Object.entries(COOL).map(([key,c]) => `
          <div class="cool-card ${state.coolMethod===key?'active':''}" data-cool="${key}">
            <div class="cc-name">${c.name}</div>
            <div class="cc-note">${c.note}</div>
          </div>
        `).join('')}
      </div>
      <div class="field-pair">
        <div class="value-box">
          <div class="vb-label">模具實際溫度</div>
          <div class="vb-value num">${actualTemp.toFixed(1)}<span class="vb-unit">°C</span></div>
          <div class="gauge-track"><div class="gauge-fill" style="width:${Math.min(100, actualTemp/320*100)}%"></div></div>
        </div>
        <div class="value-box"><div class="vb-label">本站瞬時功率（${cool.name}）</div><div class="vb-value num">${(cool.kwh*3 + Math.random()).toFixed(1)}<span class="vb-unit">kW</span></div></div>
      </div>
      <div class="countdown-row">
        <span class="cd-time num">${remain.toFixed(1)}s</span>
        <span class="cd-note">本站累計耗電：${(kwhTargetFor(3)*p).toFixed(1)} 度</span>
      </div>
    `;
    document.querySelectorAll('.cool-card').forEach(c => {
      c.addEventListener('click', () => {
        state.coolMethod = c.dataset.cool;
        state.elapsedBeforePause = 0;
        state.stepStartTs = Date.now();
        renderAll();
      });
    });
    return;
  }

  if (state.currentStep === 4) {
    const showBaffle = !!recipe.extraChecklist;
    el.innerHTML = `
      <h3>STEP 4・修邊、鑽孔、配件組裝</h3>
      <div class="checklist">
        <label><input type="checkbox" id="chkEdge" ${state.checklist.edge?'checked':''}> 修邊完成</label>
        <label><input type="checkbox" id="chkDrill" ${state.checklist.drill?'checked':''}> 鑽孔完成</label>
        ${showBaffle ? `<label><input type="checkbox" id="chkBaffle" ${state.checklist.baffle?'checked':''}> ${recipe.extraChecklist}完成（化糞槽專屬工序）</label>` : ''}
      </div>
      <div class="btn-row">
        <button class="btn primary" id="btnStep4Done" ${allChecked(showBaffle)?'':'disabled'}>完工回報，進入檢驗入庫 →</button>
      </div>
    `;
    const bind = (id, key) => { const e=document.getElementById(id); if(e) e.addEventListener('change', ()=>{ state.checklist[key]=e.checked; renderStation(); renderControls(); }); };
    bind('chkEdge','edge'); bind('chkDrill','drill'); bind('chkBaffle','baffle');
    const btn = document.getElementById('btnStep4Done');
    if (btn) btn.addEventListener('click', () => { state.currentStep = 5; renderAll(); });
    return;
  }

  if (state.currentStep === 5) {
    el.innerHTML = `
      <h3>STEP 5・檢驗、水密測試、入庫</h3>
      <div class="control-grid">
        <div class="field">
          <label>外觀檢驗結果</label>
          <select id="inspResult">
            <option value="">請選擇</option>
            <option value="pass" ${state.inspection.result==='pass'?'selected':''}>合格</option>
            <option value="fail" ${state.inspection.result==='fail'?'selected':''}>不合格</option>
          </select>
        </div>
        ${state.inspection.result==='fail' ? `
        <div class="field">
          <label>不良原因代碼</label>
          <select id="inspReason">
            <option value="">請選擇</option>
            <option ${state.inspection.reason==='surface'?'selected':''} value="surface">外觀瑕疵</option>
            <option ${state.inspection.reason==='thickness'?'selected':''} value="thickness">厚度不均</option>
            <option ${state.inspection.reason==='bubble'?'selected':''} value="bubble">氣泡／縮孔</option>
            <option ${state.inspection.reason==='dim'?'selected':''} value="dim">尺寸公差超出</option>
          </select>
        </div>` : ''}
        <div class="field">
          <label>水密測試結果</label>
          <select id="leakResult">
            <option value="">請選擇</option>
            <option value="pass" ${state.inspection.leak==='pass'?'selected':''}>通過</option>
            <option value="fail" ${state.inspection.leak==='fail'?'selected':''}>未通過</option>
          </select>
        </div>
        <div class="field">
          <label>本批入庫數量（件）</label>
          <input type="number" id="qtyInput" min="1" value="${state.qty}">
        </div>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="btnFinish" ${canFinish()?'':'disabled'}>完成入庫，產生生產報告 →</button>
      </div>
    `;
    const r = document.getElementById('inspResult'); if(r) r.addEventListener('change', ()=>{ state.inspection.result=r.value; renderStation(); });
    const rs = document.getElementById('inspReason'); if(rs) rs.addEventListener('change', ()=>{ state.inspection.reason=rs.value; });
    const l = document.getElementById('leakResult'); if(l) l.addEventListener('change', ()=>{ state.inspection.leak=l.value; renderStation(); });
    const q = document.getElementById('qtyInput'); if(q) q.addEventListener('input', ()=>{ state.qty=Math.max(1, Number(q.value)||1); renderStation(); });
    const f = document.getElementById('btnFinish'); if(f) f.addEventListener('click', finishBatch);
    return;
  }
}

function allChecked(showBaffle) {
  return state.checklist.edge && state.checklist.drill && (!showBaffle || state.checklist.baffle);
}
function canFinish() {
  return state.inspection.result && state.inspection.leak && state.qty >= 1;
}

/* ---------- render: report ---------- */
function renderReport() {
  const el = document.getElementById('reportArea');
  if (state.currentStep < 6) { el.innerHTML = ''; return; }
  const total = state.stepKwh[1] + state.stepKwh[2] + state.stepKwh[3];
  const unit = total / state.qty;
  const reduction = Math.round((1 - unit / GOV_AVG) * 100);
  const recipe = RECIPES[state.productKey];
  const maxBar = Math.max(state.stepKwh[1], state.stepKwh[2], state.stepKwh[3]) * 1.1;
  el.innerHTML = `
    <div class="panel report-panel">
      <h3>✔ 本批次生產報告</h3>
      <div class="report-grid">
        <div class="value-box"><div class="vb-label">批號</div><div class="vb-value" style="font-size:14px">${state.batchNo}</div></div>
        <div class="value-box"><div class="vb-label">產品</div><div class="vb-value" style="font-size:14px">${recipe.name}</div></div>
        <div class="value-box"><div class="vb-label">操作人員</div><div class="vb-value" style="font-size:14px">${state.operator}</div></div>
        <div class="value-box"><div class="vb-label">入庫數量</div><div class="vb-value num">${state.qty}<span class="vb-unit">件</span></div></div>
      </div>
      <div class="report-bars">
        <div class="bar-row"><div>原料進料</div><div class="bar-track"><div class="bar-fill" style="width:${state.stepKwh[1]/maxBar*100}%"></div></div><div class="num">${state.stepKwh[1].toFixed(1)} 度</div></div>
        <div class="bar-row"><div>加熱燒結</div><div class="bar-track"><div class="bar-fill" style="width:${state.stepKwh[2]/maxBar*100}%"></div></div><div class="num">${state.stepKwh[2].toFixed(1)} 度</div></div>
        <div class="bar-row"><div>冷卻脫模</div><div class="bar-track"><div class="bar-fill" style="width:${state.stepKwh[3]/maxBar*100}%"></div></div><div class="num">${state.stepKwh[3].toFixed(1)} 度</div></div>
      </div>
      <div class="report-grid">
        <div class="value-box"><div class="vb-label">本批總耗電</div><div class="vb-value num">${total.toFixed(1)}<span class="vb-unit">度</span></div></div>
        <div class="value-box"><div class="vb-label">單位產品耗能</div><div class="vb-value num" style="color:var(--good-text)">${unit.toFixed(1)}<span class="vb-unit">度/件</span></div></div>
        <div class="value-box"><div class="vb-label">政府產業平均係數</div><div class="vb-value num">${GOV_AVG}<span class="vb-unit">度/件</span></div></div>
      </div>
      <div class="cc-result">
        <div class="cc-pct">↓ 約 ${Math.max(0,reduction)}%</div>
        <div class="cc-desc">此批次單位產品耗能量為 ${unit.toFixed(1)} 度／件，較政府產業平均係數低約 ${Math.max(0,reduction)}%。威熊若能穩定提供此類精準單品數據，即可協助下游客戶以真實數值取代誤差較大的政府平均係數，立即反映產品碳足跡的優化成果。</div>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="btnNextBatch">開始下一批 →</button>
      </div>
    </div>
  `;
  document.getElementById('btnNextBatch').addEventListener('click', () => {
    resetState(true);
    renderAll();
  });
}

/* ---------- helpers ---------- */
function elapsedOf(step) {
  if (state.currentStep !== step) return msFor(step);
  return state.elapsedBeforePause + (state.paused ? 0 : (Date.now() - state.stepStartTs));
}
function progressOf(step) { return Math.min(1, elapsedOf(step) / msFor(step)); }
function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }

function renderAll() {
  renderHeader(); renderControls(); renderStepper(); renderDashboard(); renderAlarm(); renderStation(); renderReport();
}

/* ---------- render: smart energy management dashboard ---------- */
function renderDashboard() {
  const el = document.getElementById('dashboardArea');
  const liveOn = state.running && !state.stopped;
  const liveLine = liveOn
    ? `🔗 即時連線中：批號 ${state.batchNo}・目前站別「${STEP_LABELS[state.currentStep]}」・參數已數位化同步至智慧能源管理系統`
    : '🔗 待機：尚無即時製程數據回傳，啟動生產後參數將由人工記錄改為數位化即時監控';

  const minUnit = paramHistory.length ? Math.min(...paramHistory.map(r => r.unitKwh)) : null;
  const bestRecord = paramHistory.find(r => r.unitKwh === minUnit);

  el.innerHTML = `
    <div class="panel dashboard-panel">
      <h3>📊 智慧能源管理系統｜數位化監控儀表板</h3>
      <p class="dash-desc">加熱燒結參數已由人工記錄改為數位化即時控制與回饋，系統持續保留最近 3 組生產紀錄，用以驗證不同參數組的單位產品耗能差異，協助選出最小耗能量的參數組。</p>
      <div class="live-line ${liveOn ? 'on' : ''}">${liveLine}</div>
      <div class="hist-table">
        <div class="hist-row head"><div>批號</div><div>產品</div><div>爐溫・時間</div><div>冷卻方式</div><div>單位產品耗能</div></div>
        ${paramHistory.length === 0
          ? `<div class="hist-empty">尚無驗證紀錄，請完成生產批次以開始比較（已累積 0/3 組）</div>`
          : paramHistory.map(r => `
            <div class="hist-row ${r.unitKwh === minUnit ? 'best' : ''}">
              <div>${r.batchNo}</div>
              <div>${r.productName}</div>
              <div class="num">${r.temp}°C・${r.time}分</div>
              <div>${r.coolName}</div>
              <div class="num">${r.unitKwh.toFixed(1)} 度/件${r.unitKwh === minUnit ? ' <span class="badge-min">★ 最小耗能</span>' : ''}</div>
            </div>
          `).join('')
        }
      </div>
      ${paramHistory.length < 3
        ? `<p class="dash-hint">已累積 ${paramHistory.length}/3 組紀錄。切換「控制模式：手動」可調整爐溫／時間，STEP 3 也可切換冷卻方式，跑出不同參數組的批次即可累積比較。</p>`
        : `<p class="dash-hint">已完成 3 組參數驗證，系統建議採用批號「${bestRecord.batchNo}」之參數組（爐溫 ${bestRecord.temp}°C・時間 ${bestRecord.time}分・${bestRecord.coolName}）以達最小單位產品耗能 ${bestRecord.unitKwh.toFixed(1)} 度/件。</p>`}
      ${paramHistory.length > 0 ? `<div class="btn-row"><button class="btn ghost" id="btnClearHist">清空紀錄</button></div>` : ''}
    </div>
  `;
  const clearBtn = document.getElementById('btnClearHist');
  if (clearBtn) clearBtn.addEventListener('click', () => { paramHistory = []; renderDashboard(); });
}

/* ---------- engine ---------- */
function tick() {
  if (!state.running || state.paused || state.stopped) return;
  // Steps 4-5 are manual/human-paced — no timer, so no re-render here.
  // (Without this guard, this 100ms loop kept rebuilding the checklist DOM
  // under the user's cursor, which made STEP 4 checkboxes/buttons unclickable.)
  if (state.currentStep < 1 || state.currentStep > 3) return;
  const p = progressOf(state.currentStep);
  if (p >= 1) {
    state.stepKwh[state.currentStep] = kwhTargetFor(state.currentStep);
    if (state.currentStep === 2) state.heatEndTemp = state.setpoint.temp;
    if (state.currentStep === 3) {
      state.currentStep = 4; // manual station, stop auto engine here
      renderAll();
      return;
    }
    state.currentStep += 1;
    state.elapsedBeforePause = 0;
    state.stepStartTs = Date.now();
  }
  renderAll();
}
setInterval(tick, 100);

/* ---------- actions ---------- */
function resetState(keepIdentity) {
  const productKey = keepIdentity ? state.productKey : state.productKey;
  const operator = keepIdentity ? state.operator : '';
  const mode = state.mode;
  state = {
    productKey, batchNo: '', operator, mode, coolMethod: 'air',
    setpoint: { temp: RECIPES[productKey].temp, time: RECIPES[productKey].time },
    qty: 1, currentStep: 0, running: false, paused: false, stopped: false,
    stepStartTs: 0, elapsedBeforePause: 0, totalKwh: 0, stepKwh: {1:0,2:0,3:0},
    heatEndTemp: 25, checklist: { edge:false, drill:false, baffle:false },
    inspection: { result:'', leak:'', reason:'' }, timerId: null
  };
}

function finishBatch() {
  const recipe = RECIPES[state.productKey];
  const total = state.stepKwh[1] + state.stepKwh[2] + state.stepKwh[3];
  paramHistory.push({
    batchNo: state.batchNo,
    productName: recipe.name,
    temp: state.setpoint.temp,
    time: state.setpoint.time,
    coolName: COOL[state.coolMethod].name,
    totalKwh: total,
    qty: state.qty,
    unitKwh: total / state.qty
  });
  if (paramHistory.length > 3) paramHistory.shift();

  state.currentStep = 6;
  state.running = false;
  renderAll();
}

document.getElementById('productSelect').addEventListener('change', (e) => {
  state.productKey = e.target.value;
  state.setpoint.temp = RECIPES[state.productKey].temp;
  state.setpoint.time = RECIPES[state.productKey].time;
  state.checklist = { edge:false, drill:false, baffle:false };
  renderAll();
});
document.getElementById('operatorInput').addEventListener('input', (e) => {
  state.operator = e.target.value;
  document.getElementById('operatorField').classList.remove('error');
});
document.querySelectorAll('#modeToggle button').forEach(b => {
  b.addEventListener('click', () => { state.mode = b.dataset.mode; renderControls(); });
});
document.getElementById('tempInput').addEventListener('change', (e) => {
  state.setpoint.temp = Math.min(300, Math.max(200, Number(e.target.value) || RECIPES[state.productKey].temp));
  renderControls(); renderStation();
});
document.getElementById('timeInput').addEventListener('change', (e) => {
  state.setpoint.time = Math.min(60, Math.max(20, Number(e.target.value) || RECIPES[state.productKey].time));
  renderControls(); renderStation();
});

document.getElementById('btnStart').addEventListener('click', () => {
  if (!state.operator.trim()) {
    document.getElementById('operatorField').classList.add('error');
    return;
  }
  state.batchNo = genBatchNo();
  state.running = true;
  state.paused = false;
  state.stopped = false;
  state.currentStep = 1;
  state.elapsedBeforePause = 0;
  state.stepStartTs = Date.now();
  renderAll();
});
document.getElementById('btnPause').addEventListener('click', () => {
  if (state.paused) {
    state.paused = false;
    state.stepStartTs = Date.now();
  } else {
    state.elapsedBeforePause += Date.now() - state.stepStartTs;
    state.paused = true;
  }
  renderAll();
});
document.getElementById('btnStop').addEventListener('click', () => {
  state.stopped = true;
  state.running = false;
  renderAll();
});
document.getElementById('btnReset').addEventListener('click', () => {
  resetState(true);
  renderAll();
});

renderAll();
</script>

</body>
</html>
