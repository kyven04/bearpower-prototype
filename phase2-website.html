<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>威熊塑膠科技｜官網 Prototype v2</title>
<style>
  :root {
    color-scheme: light;
    --ink:        #0b0b0b;
    --ink-soft:   #4a4a48;
    --ink-mute:   #8a8985;
    --line:       #e4e3dd;
    --paper:      #ffffff;
    --paper-soft: #f4f5f6;
    --blue:       #0b63c9;
    --blue-deep:  #08429c;
    --blue-tint:  #eaf2fc;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--paper); color:var(--ink);
    font-family: system-ui,-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif; }
  img { max-width:100%; display:block; }
  a { color:inherit; text-decoration:none; }
  .wrap { max-width: 1200px; margin:0 auto; padding:0 32px; }
  .eyebrow { font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--blue); margin-bottom:10px; }
  .btn-pill {
    display:inline-flex; align-items:center; gap:8px; font-size:13.5px; font-weight:700;
    padding:13px 26px; border-radius:999px; background:var(--blue); color:#fff; border:1px solid var(--blue); cursor:pointer;
  }
  .btn-pill.outline { background:transparent; color:#fff; border-color:rgba(255,255,255,.6); }
  .btn-pill.dark { background:var(--ink); border-color:var(--ink); }

  /* ---- nav ---- */
  header.nav { position:sticky; top:0; z-index:50; background:var(--paper); border-bottom:1px solid var(--line); }
  .nav-inner { max-width:1200px; margin:0 auto; padding:14px 32px; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; }
  .nav-brand { display:flex; align-items:center; gap:10px; }
  .nav-brand img { width:40px; height:40px; }
  .nav-brand-text { display:flex; flex-direction:column; line-height:1.25; }
  .nav-brand-name { font-weight:800; font-size:14.5px; }
  .nav-brand-sub { font-size:10.5px; color:var(--ink-mute); letter-spacing:.04em; }
  .nav-links { display:flex; align-items:center; gap:28px; flex-wrap:wrap; }
  .nav-links a { font-size:13px; font-weight:600; color:var(--ink-soft); }
  .nav-links a:hover { color:var(--blue); }
  .lang-toggle { font-family:inherit; font-size:12px; font-weight:700; padding:7px 15px; border-radius:999px; border:1px solid var(--ink); background:var(--paper); color:var(--ink); cursor:pointer; }

  /* ---- hero ---- */
  section#hero { position:relative; min-height:640px; display:flex; align-items:flex-end; overflow:hidden; }
  #heroImg { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .hero-scrim { position:absolute; inset:0; background:linear-gradient(0deg, rgba(6,10,20,.86) 0%, rgba(6,10,20,.55) 45%, rgba(6,10,20,.25) 100%); }
  .hero-inner { position:relative; z-index:2; color:#fff; padding:80px 32px 56px; width:100%; }
  .hero-word { font-size:clamp(48px,9vw,120px); font-weight:800; letter-spacing:-.02em; line-height:.95; margin:0 0 18px; }
  .hero-tag { font-size:clamp(16px,2vw,20px); font-weight:700; margin:0 0 14px; }
  .hero-sub { font-size:14.5px; max-width:560px; line-height:1.8; color:rgba(255,255,255,.86); margin:0 0 28px; }

  /* ---- capability block ---- */
  section#capability { background:var(--blue); color:#fff; padding:80px 0; position:relative; overflow:hidden; }
  .cap-ghost { position:absolute; top:-.15em; left:0; right:0; text-align:center; font-size:clamp(60px,11vw,180px); font-weight:800; color:rgba(255,255,255,.10); white-space:nowrap; line-height:1; user-select:none; }
  .cap-inner { position:relative; z-index:2; max-width:640px; }
  .cap-inner h2 { font-size:clamp(26px,4vw,40px); line-height:1.35; margin:0 0 18px; }
  .cap-inner p { font-size:14.5px; line-height:1.9; color:rgba(255,255,255,.9); margin:0 0 26px; }

  /* ---- about ---- */
  section#about { padding:88px 0; border-bottom:1px solid var(--line); }
  .about-grid { display:grid; grid-template-columns: 0.9fr 1.3fr; gap:50px; }
  @media (max-width:800px){ .about-grid{ grid-template-columns:1fr; } }
  .about-sticky { position:sticky; top:90px; align-self:start; }
  .about-sticky h2 { font-size:clamp(26px,3.6vw,36px); margin:0 0 16px; }
  .about-sticky p { font-size:14px; color:var(--ink-soft); line-height:1.85; margin:0 0 22px; }
  .about-photo { border-radius:14px; overflow:hidden; margin-bottom:26px; }
  .about-photo img { width:100%; height:280px; object-fit:cover; }
  .about-facts { display:grid; grid-template-columns:repeat(2,1fr); gap:14px; }
  .fact-card { background:var(--paper-soft); border:1px solid var(--line); border-radius:10px; padding:16px 18px; }
  .fact-label { font-size:11px; color:var(--ink-mute); margin-bottom:5px; }
  .fact-value { font-size:14.5px; font-weight:700; line-height:1.5; }
  .locations { margin-top:8px; }
  .locations li { font-size:13px; color:var(--ink-soft); padding:9px 0; border-top:1px solid var(--line); display:flex; justify-content:space-between; gap:10px; }
  .locations { list-style:none; padding:0; margin:0; }

  /* ---- products ---- */
  section#products { padding:88px 0; border-bottom:1px solid var(--line); }
  .products-head { display:flex; justify-content:space-between; align-items:flex-end; gap:20px; margin-bottom:36px; flex-wrap:wrap; }
  .products-head h2 { font-size:clamp(26px,3.6vw,38px); margin:0; }
  .products-head p { font-size:13.5px; color:var(--ink-mute); max-width:420px; margin:0; }
  .product-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:2px; background:var(--line); border:1px solid var(--line); }
  .product-card { background:var(--paper); cursor:pointer; padding:0; }
  .pc-photo { background:var(--paper-soft); aspect-ratio:4/3; display:flex; align-items:center; justify-content:center; padding:22px; }
  .pc-photo img { max-height:100%; object-fit:contain; }
  .pc-meta { padding:16px 18px 20px; }
  .pc-index { font-size:11px; color:var(--blue); font-weight:800; margin-bottom:6px; }
  .pc-name { font-size:15px; font-weight:700; margin-bottom:4px; }
  .pc-name-en { font-size:11.5px; color:var(--ink-mute); }

  .product-detail { grid-column:1/-1; background:var(--ink); color:#fff; padding:40px 36px; }
  .pd-grid { display:grid; grid-template-columns:1fr 1.4fr; gap:40px; align-items:center; }
  @media (max-width:700px){ .pd-grid{ grid-template-columns:1fr; } }
  .pd-photo { background:#fff; border-radius:12px; padding:24px; display:flex; align-items:center; justify-content:center; min-height:220px; }
  .pd-photo img { max-height:260px; object-fit:contain; }
  .pd-index { font-size:12px; color:#8fb8ee; font-weight:800; margin-bottom:8px; }
  .pd-name { font-size:26px; font-weight:800; margin:0 0 4px; }
  .pd-name-en { font-size:13px; color:#9aa2ad; margin-bottom:16px; }
  .pd-desc { font-size:13.5px; line-height:1.85; color:#d7dade; margin-bottom:16px; }
  .pd-note { font-size:12px; color:#8fb8ee; }
  .pd-close { margin-top:20px; }

  /* ---- contact ---- */
  section#contact { padding:88px 0; }
  .contact-grid { display:grid; grid-template-columns:1fr 1fr; gap:50px; }
  @media (max-width:800px){ .contact-grid{ grid-template-columns:1fr; } }
  .contact-grid h2 { font-size:clamp(26px,3.6vw,36px); margin:0 0 16px; }
  .contact-grid p { font-size:14px; color:var(--ink-soft); line-height:1.85; margin:0 0 20px; }
  .contact-info li { list-style:none; font-size:13.5px; color:var(--ink-soft); padding:12px 0; border-top:1px solid var(--line); }
  .contact-info { padding:0; margin:0 0 20px; }
  .contact-info b { display:block; font-size:11px; color:var(--ink-mute); font-weight:600; margin-bottom:4px; }
  .contact-form label { display:block; font-size:12px; color:var(--ink-mute); margin-bottom:6px; }
  .contact-form input, .contact-form textarea { width:100%; font-family:inherit; font-size:13.5px; padding:11px 12px; border-radius:8px; border:1px solid var(--line); background:var(--paper-soft); margin-bottom:14px; }
  .contact-form textarea { min-height:100px; resize:vertical; }

  /* ---- footer ---- */
  footer.pagefoot { background:var(--blue); color:#fff; padding:64px 0 34px; }
  .foot-top { display:flex; justify-content:space-between; gap:30px; flex-wrap:wrap; margin-bottom:56px; }
  .foot-contact p { font-size:13px; color:rgba(255,255,255,.8); margin:0 0 14px; }
  .foot-contact .foot-phone { font-size:30px; font-weight:800; margin:0 0 16px; }
  .foot-nav { display:flex; flex-direction:column; gap:10px; align-items:flex-end; }
  .foot-nav a { font-size:13.5px; font-weight:600; }
  .foot-word { font-size:clamp(52px,11vw,150px); font-weight:800; letter-spacing:-.02em; line-height:1; opacity:.9; }
  .foot-bottom { display:flex; justify-content:space-between; font-size:11.5px; color:rgba(255,255,255,.7); flex-wrap:wrap; gap:10px; margin-top:20px; }

  /* ---- chat widget ---- */
  .chat-launcher { position:fixed; right:22px; bottom:22px; z-index:60; width:58px; height:58px; border-radius:50%; background:var(--blue); color:#fff; border:none; font-size:24px; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.25); }
  .chat-panel { position:fixed; right:22px; bottom:92px; z-index:60; width:340px; max-width:calc(100vw - 44px); max-height:68vh; background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:0 12px 34px rgba(0,0,0,.25); display:flex; flex-direction:column; overflow:hidden; }
  .chat-head { background:var(--blue); color:#fff; padding:12px 16px; font-size:13.5px; font-weight:700; display:flex; align-items:center; justify-content:space-between; }
  .chat-head button { background:none; border:none; color:#fff; font-size:16px; cursor:pointer; }
  .chat-body { flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px; }
  .chat-chips { display:flex; flex-wrap:wrap; gap:6px; padding:0 14px 10px; }
  .chat-chip { font-family:inherit; font-size:11px; padding:6px 10px; border-radius:999px; border:1px solid var(--blue); background:var(--blue-tint); color:var(--blue); cursor:pointer; }
  .msg { max-width:85%; font-size:12.5px; line-height:1.6; padding:8px 11px; border-radius:10px; }
  .msg.user { align-self:flex-end; background:var(--blue); color:#fff; border-bottom-right-radius:2px; }
  .msg.ai { align-self:flex-start; background:var(--paper-soft); color:var(--ink); border-bottom-left-radius:2px; }
  .msg .msg-links { margin-top:8px; display:flex; flex-wrap:wrap; gap:6px; }
  .msg .msg-links button { font-family:inherit; font-size:11px; font-weight:700; padding:5px 9px; border-radius:7px; border:1px solid var(--blue); background:#fff; color:var(--blue); cursor:pointer; }
  .chat-input-row { display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line); }
  .chat-input-row input { flex:1; font-family:inherit; font-size:12.5px; padding:8px 10px; border-radius:8px; border:1px solid var(--line); }
  .chat-input-row button { font-family:inherit; font-size:12px; font-weight:700; padding:8px 12px; border-radius:8px; border:1px solid var(--blue); background:var(--blue); color:#fff; cursor:pointer; }
</style>
</head>

function IMGKEY(k){ return k; }

let state = { lang:'zh', activeProduct:null, chatOpen:false, chatMessages:[] };
function T(){ return CONTENT[state.lang]; }

function renderNav(){
  const t=T();
  document.getElementById('brandName').textContent=t.brand.name;
  document.getElementById('brandSub').textContent=t.brand.sub;
  document.getElementById('navHome').textContent=t.nav.home;
  document.getElementById('navAbout').textContent=t.nav.about;
  document.getElementById('navProducts').textContent=t.nav.products;
  document.getElementById('navContact').textContent=t.nav.contact;
  document.getElementById('langToggle').textContent=t.nav.lang;
}
function renderHero(){
  const t=T();
  document.getElementById('heroTag').textContent=t.hero.tag;
  document.getElementById('heroSub').textContent=t.hero.sub;
  document.getElementById('heroCta').textContent=t.hero.cta;
}
function renderCapability(){
  const t=T();
  document.getElementById('capGhost').textContent=t.capability.ghost;
  document.getElementById('capEyebrow').textContent=t.capability.eyebrow;
  document.getElementById('capTitle').textContent=t.capability.title;
  document.getElementById('capBody').textContent=t.capability.body;
  document.getElementById('capCta').textContent=t.capability.cta;
}
function renderAbout(){
  const t=T();
  document.getElementById('aboutEyebrow').textContent=t.about.eyebrow;
  document.getElementById('aboutTitle').textContent=t.about.title;
  document.getElementById('aboutBody').textContent=t.about.body;
  document.getElementById('aboutLocations').innerHTML = t.about.locations.map(l=>`<li>${l.name}<span style="color:var(--ink-mute)">${l.tag}</span></li>`).join('');
  document.getElementById('aboutFacts').innerHTML = t.about.facts.map(f=>`<div class="fact-card"><div class="fact-label">${f.label}</div><div class="fact-value">${f.value}</div></div>`).join('');
}
function renderProducts(){
  const t=T();
  document.getElementById('productsTitle').textContent=t.productsTitle;
  document.getElementById('productsSub').textContent=t.productsSub;
  const grid=document.getElementById('productGrid');
  grid.innerHTML = t.products.map((p,i)=>`
    <button class="product-card" data-pid="${p.id}">
      <div class="pc-photo"><img src="${IMG[p.img]}" alt="${p.zh}" loading="lazy"></div>
      <div class="pc-meta">
        <div class="pc-index">${String(i+1).padStart(2,'0')}</div>
        <div class="pc-name">${state.lang==='zh'?p.zh:p.en}</div>
        <div class="pc-name-en">${state.lang==='zh'?p.en:p.zh}</div>
      </div>
    </button>
  `).join('') + (state.activeProduct ? renderProductDetail(t.products.find(p=>p.id===state.activeProduct), t.products.findIndex(p=>p.id===state.activeProduct)) : '');

  grid.querySelectorAll('.product-card').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const pid=btn.dataset.pid;
      state.activeProduct = state.activeProduct===pid ? null : pid;
      renderProducts();
      if (state.activeProduct) document.getElementById('productGrid').scrollIntoView({behavior:'smooth', block:'nearest'});
    });
  });
  const closeBtn = grid.querySelector('.pd-close');
  if (closeBtn) closeBtn.addEventListener('click', (e)=>{ e.stopPropagation(); state.activeProduct=null; renderProducts(); });
}
function renderProductDetail(p, idx){
  return `
    <div class="product-detail">
      <div class="pd-grid">
        <div class="pd-photo"><img src="${IMG[p.img]}" alt="${p.zh}"></div>
        <div>
          <div class="pd-index">${String(idx+1).padStart(2,'0')} / ${T().products.length}</div>
          <div class="pd-name">${state.lang==='zh'?p.zh:p.en}</div>
          <div class="pd-name-en">${state.lang==='zh'?p.en:p.zh}</div>
          <p class="pd-desc">${p.desc}</p>
          ${p.note ? `<div class="pd-note">${p.note}</div>` : ''}
          <button class="btn-pill outline pd-close" style="border-color:#fff;">${state.lang==='zh'?'收合 ▲':'Collapse ▲'}</button>
        </div>
      </div>
    </div>
  `;
}
function renderContact(){
  const t=T();
  document.getElementById('contactEyebrow').textContent=t.contact.eyebrow;
  document.getElementById('contactTitle').textContent=t.contact.title;
  document.getElementById('contactBody').textContent=t.contact.body;
  document.getElementById('contactInfo').innerHTML = t.contact.info.map(i=>`<li><b>${i.label}</b>${i.value}</li>`).join('');
  const l=t.contact.labels;
  document.getElementById('contactForm').innerHTML = `
    <label>${l.name}</label><input type="text">
    <label>${l.company}</label><input type="text">
    <label>${l.email}</label><input type="text">
    <label>${l.message}</label><textarea></textarea>
    <button class="btn-pill dark" type="button" disabled style="opacity:.5; cursor:not-allowed; width:100%; justify-content:center;">${l.submit}</button>
  `;
}
function renderFooter(){
  const t=T();
  document.getElementById('footContactLabel').textContent=t.footer.contactLabel;
  document.getElementById('footPhone').textContent=t.contact.info[0].value;
  document.getElementById('footCta').textContent=t.footer.cta;
  document.getElementById('footNavHome').textContent=t.nav.home;
  document.getElementById('footNavAbout').textContent=t.nav.about;
  document.getElementById('footNavProducts').textContent=t.nav.products;
  document.getElementById('footNavContact').textContent=t.nav.contact;
  document.getElementById('footCopy').textContent=t.footer.copy;
  document.getElementById('footAddr').textContent=t.footer.addr;
}
function renderChat(){
  const t=T();
  document.getElementById('chatPanel').style.display = state.chatOpen ? 'flex':'none';
  document.getElementById('chatHeadTitle').textContent=t.chat.headTitle;
  document.getElementById('chatInput').placeholder=t.chat.inputPlaceholder;
  document.getElementById('chatSendBtn').textContent=t.chat.send;
  document.getElementById('chatChips').innerHTML = t.chat.qa.map(q=>`<button class="chat-chip" data-qid="${q.id}">${q.chip}</button>`).join('');
  document.getElementById('chatChips').querySelectorAll('.chat-chip').forEach(btn=>btn.addEventListener('click', ()=>sendQuickQuestion(btn.dataset.qid)));

  const body=document.getElementById('chatBody');
  body.innerHTML = state.chatMessages.map(m=>{
    if (m.from==='user'){ const text = m.qId ? t.chat.qa.find(q=>q.id===m.qId).chip : m.raw; return `<div class="msg user">${text}</div>`; }
    const qa=t.chat.qa.find(q=>q.id===m.qId);
    const replyText = qa ? qa.reply : t.chat.fallback;
    let links='';
    if (qa && qa.linkTo==='pick'){ links=`<div class="msg-links">${qa.picks.map(pid=>{ const p=t.products.find(pp=>pp.id===pid); return `<button data-goto="${pid}">${state.lang==='zh'?p.zh:p.en}</button>`; }).join('')}</div>`; }
    else if (qa && qa.linkTo==='products'){ links=`<div class="msg-links"><button data-goto="products">${t.chat.viewProduct}</button></div>`; }
    else if (qa && qa.linkTo==='contact'){ links=`<div class="msg-links"><button data-goto="contact">${t.nav.contact} →</button></div>`; }
    return `<div class="msg ai">${replyText}${links}</div>`;
  }).join('');
  body.scrollTop=body.scrollHeight;
  body.querySelectorAll('[data-goto]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const goto=btn.dataset.goto;
      if (goto==='products'||goto==='contact'){ document.getElementById(goto).scrollIntoView({behavior:'smooth'}); }
      else { state.activeProduct=goto; renderProducts(); document.getElementById('products').scrollIntoView({behavior:'smooth'}); }
    });
  });
}
function sendQuickQuestion(qId){ state.chatMessages.push({from:'user',qId}); state.chatMessages.push({from:'ai',qId}); renderChat(); }
function sendFreeText(raw){
  if(!raw.trim()) return;
  const lower=raw.toLowerCase(); const t=T();
  const matched=t.chat.qa.find(q=>q.keywords.some(k=>lower.includes(k.toLowerCase())));
  state.chatMessages.push({from:'user',raw});
  state.chatMessages.push({from:'ai', qId: matched?matched.id:null});
  renderChat();
}

function renderAll(){ renderNav(); renderHero(); renderCapability(); renderAbout(); renderProducts(); renderContact(); renderFooter(); renderChat(); }

document.getElementById('langToggle').addEventListener('click', ()=>{ state.lang = state.lang==='zh'?'en':'zh'; renderAll(); });
document.getElementById('chatLauncher').addEventListener('click', ()=>{ state.chatOpen=!state.chatOpen; renderChat(); });
document.getElementById('chatCloseBtn').addEventListener('click', ()=>{ state.chatOpen=false; renderChat(); });
document.getElementById('chatSendBtn').addEventListener('click', ()=>{ const i=document.getElementById('chatInput'); sendFreeText(i.value); i.value=''; });
document.getElementById('chatInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter'){ const i=document.getElementById('chatInput'); sendFreeText(i.value); i.value=''; } });

renderAll();
</script>
